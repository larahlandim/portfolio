<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Admin | Portfólio</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="assets/css/style.css" rel="stylesheet">
</head>
<body>
  <div id="topo"></div>

  <main class="container py-5">
    <section id="tela-pin" class="mx-auto" style="max-width: 320px;">
      <h1 class="h4 text-center">Área restrita</h1>
      <form id="form-pin">
        <input type="password" id="pin" class="form-control mb-2" placeholder="Digite o PIN">
        <button type="submit" class="btn btn-dark w-100">Entrar</button>
      </form>
    </section>

    <section id="painel" class="d-none">
      <div class="d-flex justify-content-between align-items-center mb-3 flex-wrap gap-2">
        <h1 class="h3">Mensagens (<span id="total"></span>)</h1>
        <button id="btn-nova" class="btn btn-success">+ Nova mensagem</button>
      </div>
      <div class="table-responsive">
        <table class="table table-striped align-middle">
          <thead><tr><th>Nome</th><th>E-mail</th><th>Assunto</th><th>Data</th><th>Ações</th></tr></thead>
          <tbody id="tabela-mensagens"></tbody>
        </table>
      </div>
    </section>
  </main>

  <div class="modal fade" id="modal-msg" tabindex="-1">
    <div class="modal-dialog">
      <form id="form-modal" class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">Mensagem</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <input type="hidden" id="edit-id">
          <input id="edit-nome" class="form-control mb-2" placeholder="Nome" required>
          <input id="edit-email" type="email" class="form-control mb-2" placeholder="E-mail" required>
          <input id="edit-assunto" class="form-control mb-2" placeholder="Assunto" required>
          <textarea id="edit-mensagem" class="form-control" rows="4" placeholder="Mensagem" required></textarea>
        </div>
        <div class="modal-footer">
          <button type="submit" class="btn btn-primary">Salvar</button>
        </div>
      </form>
    </div>
  </div>

  <div id="rodape"></div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="assets/js/layout.js"></script>
  <script src="assets/js/storage.js"></script>
  <script src="assets/js/admin.js"></script>
</body>
</html>
