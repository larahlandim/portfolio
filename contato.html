<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Contato | Portfólio</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="assets/css/style.css" rel="stylesheet">
</head>
<body>
  <div id="topo"></div>

  <main class="container py-5">
    <h1>Contato</h1>
    <form id="form-contato" class="row g-3" novalidate>
      <div class="col-12 col-md-6">
        <label for="nome" class="form-label">Nome</label>
        <input type="text" id="nome" class="form-control" required>
        <div class="invalid-feedback">Digite seu nome.</div>
      </div>
      <div class="col-12 col-md-6">
        <label for="email" class="form-label">E-mail</label>
        <input type="email" id="email" class="form-control" required>
        <div class="invalid-feedback">Digite um e-mail válido.</div>
      </div>
      <div class="col-12">
        <label for="assunto" class="form-label">Assunto</label>
        <input type="text" id="assunto" class="form-control" required>
        <div class="invalid-feedback">Digite o assunto.</div>
      </div>
      <div class="col-12">
        <label for="mensagem" class="form-label">Mensagem</label>
        <textarea id="mensagem" class="form-control" rows="5" required></textarea>
        <div class="invalid-feedback">Escreva sua mensagem.</div>
      </div>
      <div class="col-12">
        <button type="submit" class="btn btn-primary">Enviar</button>
      </div>
    </form>
    <div id="alerta" class="mt-3"></div>
  </main>

  <div id="rodape"></div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
  <script src="assets/js/layout.js"></script>
  <script src="assets/js/storage.js"></script>
  <script src="assets/js/contato.js"></script>
</body>
</html>
